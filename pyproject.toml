[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphguard"
version = "0.1.0"
description = "Reliability auditing for LLM-extracted graph databases"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "openai>=1.30",
  "datasets>=2.18",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "tenacity>=8.2",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "networkx>=3.1",
  "kuzu==0.11.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]
toolchain = [
  "langchain-openai==1.3.5",
  "langchain-experimental==0.4.2",
  "langchain-core==1.4.9",
]

[tool.setuptools.packages.find]
include = ["graphguard*"]

[tool.uv]
# Exact versions from the environment that generated and verified the submitted
# cached artifacts and figures. These constrain uv.lock without making the
# reusable library metadata artificially exact for downstream users.
constraint-dependencies = [
  "openai==2.45.0",
  "datasets==4.3.0",
  "pyyaml==6.0.2",
  "tqdm==4.67.1",
  "python-dotenv==1.1.1",
  "tenacity==9.1.2",
  "numpy==1.26.4",
  "matplotlib==3.9.2",
  "scikit-learn==1.7.2",
  "networkx==3.2.1",
  "pillow==11.3.0",
  "fonttools==4.54.1",
  "cycler==0.12.1",
  "kiwisolver==1.4.7",
  "contourpy==1.3.0",
  "pyparsing==3.1.4",
  "python-dateutil==2.9.0",
  "scipy==1.14.1",
  "joblib==1.4.2",
  "threadpoolctl==3.5.0",
  "pytest==9.0.3",
]
