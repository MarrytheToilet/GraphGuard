[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphguard"
version = "0.1.0"
description = "Reliability auditing for LLM-extracted graph databases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.30",
  "datasets>=2.18",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "tenacity>=8.2",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "networkx>=3.1",
  "kuzu==0.11.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[tool.setuptools.packages.find]
include = ["graphguard*"]
